# Create a workflow .github/workflows/containers.yml with a manual trigger and a job step-container. Add a step that runs the alpine:3.22 image through uses, and prints the contents of /etc/os-release by overriding the entrypoint.
name: containers
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
    step-container:
        runs-on: ubuntu-26.04
        steps:
        - name: On the runner
          run: cat /etc/os-release
        - name: Run alpine container
          uses: docker://alpine:3.22
          with:
            entrypoint: /bin/sh
            args: -c "cat /etc/os-release"

    job-container:
        runs-on: ubuntu-latest
        container:
            image: node:22-bookworm-slim
            env:
                MY_SETTING: from-the-container-block
        steps:
        - run: |
            node --version
            cat /etc/os-release
            echo "MY_SETTING=$MY_SETTING"

    job-container2:
        runs-on: ubuntu-latest
        container:
            image: node:22-bookworm-slim
        services:
            redis:
                image: redis:7
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 5
        steps:
          - name: Reach the service by name
            run: |
                node -e "const s=require('net').connect(6379,'redis',()=>{s.write('PING\r\n')});s.on('data',d=>{console.log(d.toString());s.end()});"

    missing-tools:
        runs-on: ubuntu-latest
        container: alpine:3.22
        steps:
        - name: Install the tools that actions expect
          run: apk add --no-cache bash git jq curl
        - uses: actions/checkout@v6
          with:
            persist-credentials: false

        - name: Needs git and bash
          shell: bash
          run: git log -1