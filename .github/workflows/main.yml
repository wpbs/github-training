name: demo

permissions:
  contents: read

  
cache-mode: none


on: 
  push:
  workflow_dispatch:
    inputs:
      environment:  
        description: 'Environment to deploy to'
        required: true
        type: 'environment'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo ${{github.ref_name}}
      - run: | # Output the name of the event that triggered the workflow
          echo "Event name: ${{ github.event_name }}"
      - run: | # Output the name of the branch that the repository is currently referencing
          echo "Branch name: ${{ github.ref_name }}"
      - run: | # List all files in the repository
          echo "Files in the repository:"
          ls -R

  test:
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - run: |
          echo "🎉 The job was triggered by event: $EVENT_NAME"
          echo "🔎 The name of your branch is $REF and your repository is $REPOSITORY."
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: List files in the repository
        run: |
          echo "The repository $REPOSITORY contains the following files:"
          tree
        env:
          REPOSITORY: ${{ github.repository }}

  loadtest:
    runs-on: ubuntu-26.04
    needs: test
    # only run when triggered manual
    if: github.event_name == 'workflow_dispatch'
    steps:
      - run: |
          echo "🎉 The job was triggered by event: $EVENT_NAME"
          echo "🔎 The name of your branch is $REF and your repository is $REPOSITORY."
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
